<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .page-shell {
      max-width: 1200px;
      margin: 32px auto;
      padding: 24px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .panel {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      padding: 24px;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      min-height: 150px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.1);
      padding: 16px;
      font-size: 15px;
      resize: vertical;
      box-sizing: border-box;
      background: white;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      background: #0071e3;
      color: white;
    }
    button.secondary {
      background: #e5e5ea;
      color: #1d1d1f;
    }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .tag {
      display: inline-block;
      background: #e8f1ff;
      color: #0057c2;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    .visual-box {
      min-height: 220px;
      border-radius: 16px;
      background: linear-gradient(180deg, #f7f7f8, #eef3ff);
      border: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #444;
      overflow: hidden;
    }
    .hidden {
      display: none !important;
    }
    .explanation {
      line-height: 1.6;
      color: #2b2b2b;
    }
    .formula {
      font-size: 18px;
      font-weight: 700;
      color: #0057c2;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="topbar">
      <h2>Question → Visualization</h2>
      <a href="index.html" style="color:#1d1d1f; text-decoration:none; font-weight:600;">Back to app</a>
    </div>

    <div class="panel">
      <h3>Paste a physics question</h3>
      <textarea id="questionInput" placeholder="Example: A piston-cylinder system contains an ideal gas. The gas expands isothermally from 2 L to 5 L at 300 K. Find the work done by the gas.">A piston-cylinder system contains an ideal gas. The gas expands isothermally from 2 L to 5 L at 300 K. Find the work done by the gas.</textarea>
      <div class="btn-row">
        <button id="analyzeBtn">Analyze question</button>
        <button id="sampleBtn" class="secondary">Load sample</button>
        <button id="openMatchedModelBtn" class="secondary" type="button">Open matched model</button>
      </div>
      <div class="btn-row" style="margin-top: 12px;">
        <button type="button" class="secondary" data-example="0">Isothermal</button>
        <button type="button" class="secondary" data-example="1">Engine</button>
        <button type="button" class="secondary" data-example="2">Adiabatic</button>
        <button type="button" class="secondary" data-example="4">Entropy</button>
      </div>
    </div>

    <div id="resultPanel" class="panel hidden">
      <h3>Detected problem structure</h3>
      <div class="result-grid">
        <div>
          <h4>Process</h4>
          <span class="tag" id="processTag">-</span>
          <span class="tag" id="systemTag">-</span>
          <span class="tag" id="targetTag">-</span>
        </div>
        <div>
          <h4>Variables</h4>
          <p id="variablesText">-</p>
        </div>
        <div>
          <h4>Assumptions</h4>
          <p id="assumptionsText">-</p>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Generated visualization</h3>
      <div class="visual-box" id="visualCanvas">
        PV Diagram / piston view will appear here
      </div>
    </div>

    <div class="panel">
      <h3>Interpretation</h3>
      <div id="explanationText" class="explanation">
        We’ll explain the process and the key thermodynamic idea here.
      </div>
      <div id="formulaText" class="formula" style="margin-top:14px;"></div>
    </div>
  </div>

  <script src="question-visualizer.js"></script>
</body>
</html>
